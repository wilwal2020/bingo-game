<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- bingo ball -->
  <circle cx="32" cy="32" r="30" fill="#202834"/>
  <circle cx="32" cy="32" r="29" fill="#F1B924"/>
  <!-- inner number disc -->
  <circle cx="32" cy="33" r="19" fill="#ffffff" stroke="#d9a91e" stroke-width="1.5"/>
  <!-- letter B -->
  <text x="32" y="42" text-anchor="middle"
        font-family="'Trebuchet MS', Arial, sans-serif" font-weight="bold"
        font-size="27" fill="#202834">B</text>
